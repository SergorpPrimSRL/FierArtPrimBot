name: Build Competitor History 2023

on:
  workflow_dispatch:

jobs:
  build-history-2023:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build competitor history 2023
        run: python history_builder_2023.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/competitor_history.json data/history_cursor_2023.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update competitor history 2023"
            git pull --rebase origin main
            git push origin main
          fi
