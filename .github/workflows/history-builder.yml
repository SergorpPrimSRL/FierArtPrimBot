name: Build Competitor History

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: fierartprimbot-repo-write
  cancel-in-progress: false

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build competitor history
        run: python history_builder.py

      - name: Save history
        run: |
          git config user.name "FierArtPrimBot"
          git config user.email "actions@users.noreply.github.com"

          git add data/history_cursor.json 2>/dev/null || true
          git add data/competitor_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No history changes to save."
          else
            git commit -m "Update competitor history"
            git pull --rebase origin main
            git push origin main
          fi
